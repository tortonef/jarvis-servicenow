name: Slides to GitHub Pages

# Builds the interactive deck (docs/deck.md, Marp) and publishes it at https://<user>.github.io/<repo>/
on:
  push:
    branches: [main]
    paths:
      - docs/deck.md
      - docs/deck-theme.css
      - docs/images/**
      - .marprc.yml
      - .github/workflows/slides.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build HTML deck
        run: |
          npx -y @marp-team/marp-cli@4.1.2 --no-stdin docs/deck.md -o site/index.html
          cp -r docs/images site/images
          cp docs/deck.pdf site/deck.pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
