# docker compose up: PostgreSQL + pgvector, the Jarvis server and a Cloudflare quick tunnel.
# Jarvis reads the tunnel's public URL at startup and points ServiceNow at it.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"   # local only (55432: 5432 is often taken by a local Postgres)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  jarvis:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jarvis:${POSTGRES_PASSWORD}@db:5432/jarvis
      JARVIS_TUNNEL_METRICS: http://tunnel:2000
    volumes:
      - models:/models          # embedding model downloaded once
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://jarvis:8787
    depends_on:
      - jarvis
    restart: unless-stopped

  # On-prem lab (docker compose --profile lab up -d): the Helios domain controller
  dc01:
    profiles: [lab]
    build: lab/dc01
    hostname: dc01
    domainname: helios.local
    cap_add: [SYS_ADMIN]        # Samba stores Windows ACLs in security.* extended attributes
    environment:
      LAB_ADMIN_PASSWORD: ${LAB_ADMIN_PASSWORD:?set LAB_ADMIN_PASSWORD in .env}
      LAB_USER_PASSWORD: ${LAB_USER_PASSWORD:?set LAB_USER_PASSWORD in .env}
      LAB_SERVICE_PASSWORD: ${LAB_SERVICE_PASSWORD:?set LAB_SERVICE_PASSWORD in .env}
    volumes:
      - dc01-data:/var/lib/samba
      - dc01-etc:/etc/samba
    restart: unless-stopped

  # MID Server: the only component that talks to the lab, outbound to ServiceNow only
  mid:
    profiles: [lab]
    build: lab/mid             # needs the official image first: docker build -t mid:brazil-patch2 lab/mid/recipe
    environment:
      MID_INSTANCE_URL: ${SNOW_INSTANCE}
      MID_INSTANCE_USERNAME: ${MID_USER:?set MID_USER in .env}
      MID_INSTANCE_PASSWORD: ${MID_PASSWORD:?set MID_PASSWORD in .env}
      MID_SERVER_NAME: helios-mid
      # Read by the JarvisLdap MID Script Include; the password never goes through ServiceNow
      JARVIS_LDAP_URL: ldaps://dc01
      JARVIS_LDAP_BASE: DC=helios,DC=local
      JARVIS_LDAP_BIND_DN: CN=svc_jarvis,OU=Service Accounts,DC=helios,DC=local
      JARVIS_LDAP_PASSWORD: ${LAB_SERVICE_PASSWORD}
    depends_on: [dc01]
    restart: unless-stopped

volumes:
  pgdata:
  models:
  dc01-data:
  dc01-etc:
